<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/dev-js-team/index.js"></script>
    <link rel="stylesheet" crossorigin href="/dev-js-team/assets/index-B6yvZFHH.css">
  </head>
  <body>
    

    <main>
      
      
      
      
      
      
      <section class="contacts-section" id="contacts">
  <div class="container">
    <div class="contacts-content">
      <svg class="icon icon-divider">
        <use href="../img/sprite.svg#icon-divider"></use>
      </svg>
      <div class="title-container">
        <h2 class="section-title">Let's Tell Your Story</h2>
        <p class="section-description">
          I can't wait to hear more about your wedding! Tell me about your
          plans, and I'll be in touch to discuss how we can create magic
          together.
        </p>
      </div>
      <div class="contact-container">
        <ul class="contact-list">
          <li class="contact-item">
            <svg class="icon icon-marking" width="24" height="24">
              <use href="../img/sprite.svg#icon-mail"></use>
            </svg>
            <a href="mailto:info@mariakovalenko.com" class="contact-link"
              >info@mariakovalenko.com</a
            >
          </li>
          <li class="contact-item">
            <svg class="icon icon-marking" width="24" height="24">
              <use href="../img/sprite.svg#icon-phone"></use>
            </svg>
            <a href="tel:+405551234567" class="contact-link"
              >+40 (555) 123-4567</a
            >
          </li>
          <li class="contact-item">
            <svg class="icon icon-marking" width="24" height="24">
              <use href="../img/sprite.svg#icon-marking"></use>
            </svg>
            <a
              href="https://maps.app.goo.gl/PdNouuhEWRpiAxCK6"
              target="_blank"
              rel="noopener noreferrer"
              class="contact-link"
            >
              Raschdorffstraße 2-26, 13409 Berlin, Germany
            </a>
          </li>
        </ul>
      </div>
    </div>
    <form>
      <label>
        <p>Name*</p>
        <input
          autocomplete="off"
          type="text"
          name="name"
          placeholder="Enter your name"
          required
        />
      </label>
      <label>
        <p>Phone*</p>
        <input
          autocomplete="off"
          type="tel"
          name="tel"
          placeholder="Enter your phone number"
          required
        />
      </label>
      <label>
        <p>Message</p>
        <textarea
          name="message"
          id="message"
          placeholder="Tell me a little about you and your special day. Don't forget to include your wedding date, venue, and what you're most excited about..."
        ></textarea>
      </label>
      <button type="submit">Let's Talk</button>
    </form>
  </div>
</section>

    </main>

    

    

  </body>
</html>
