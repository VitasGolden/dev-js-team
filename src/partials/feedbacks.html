<section class="feedbacks">
  <div class="container">
    <svg class="icon icon-divider">
      <use href="/images/sprite.svg#icon-divider"></use>
    </svg>

    <div class="feedbacks-title-container" aria-hidden="true">
      <h2 class="feedbacks-title">Words from Our Wonderful Couples</h2>
      <p class="feedbacks-description">
        Read what the couples who entrusted us with their most precious memories
        have to say.
      </p>
    </div>

    <div class="feedbacks-slider swiper">
      <ul class="feedbacks-list swiper-wrapper"></ul>
    </div>

    <div class="feedbacks-bottom">
      <div class="feedbacks-dots" aria-label="Feedback navigation"></div>

      <div class="feedbacks-buttons">
        <button
          class="feedbacks-button feedbacks-button-prev"
          type="button"
          aria-label="Previous feedback"
        >
          <svg class="feedbacks-button-icon" width="24" height="24">
            <use href="./images/sprite.svg#icon-arrow-left"></use>
          </svg>
        </button>

        <button
          class="feedbacks-button feedbacks-button-next"
          type="button"
          aria-label="Next feedback"
        >
          <svg class="feedbacks-button-icon" width="24" height="24">
            <use href="./images/sprite.svg#icon-arrow-right"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
