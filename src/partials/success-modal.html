<div class="modal-overlay is-open" id="modal-succsess">
  <div class="modal">
    <button class="modal-close-btn" type="button" data-modal-close>
      <svg class="modal-close-icon" width="24" height="24">
        <use href="/images/sprite.svg#icon-close"></use>
      </svg>
    </button>
    <div class="modal-content-container">
      <h2 class="modal-title">Thank You for Your Inquiry!</h2>
      <picture>
        <source
          media="(min-width: 1440px)"
          srcset="
            /images/modal-success-desktop-x1.webp 1x,
            /images/modal-success-desktop-x2.webp 2x
          "
        />
        <source
          media="(min-width: 768px)"
          srcset="
            /images/modal-success-tablet-x1.webp 1x,
            /images/modal-success-tablet-x2.webp 2x
          "
        />
        <img
          class="modal-img"
          src="/images/modal-success-mobile-x1.webp"
          srcset="
            /images/modal-success-mobile-x1.webp 1x,
            /images/modal-success-mobile-x2.webp 2x
          "
          alt="..."
        />
      </picture>
      <p class="modal-content">
        I have received your message and I'm so excited about your interest! I
        will get in touch with you within 24-48 hours to discuss the details of
        your wedding day. In the meantime, feel free to browse my portfolio or
        follow me on Instagram for more inspiration.
      </p>
    </div>
  </div>
</div>
